<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body id="body">

    <button onclick="berubah()">ubah</button>
    <button onclick="berubah2()">ubah2</button>

    <p onmouseenter="berubah()" onmouseleave="berubah2()">
        berubah
    </p>

    <script>
        let body = document.getElementById("body");

        function berubah() {
            body.style.fontSize = "50px";
            body.style.backgroundColor = "blue";
        }

        function berubah2() {
            body.style.backgroundColor = "red";
            body.style.fontSize = "20px";
        }
    </script>

</body>
</html>
